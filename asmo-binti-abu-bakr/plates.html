<!doctype html>
<html><head><meta charset="utf-8"><title>Plates</title></head>
<body style="margin:0;background:#000">
<canvas id="gl"></canvas>
<script id="vs" type="x-shader">#version 300 es
in vec2 aPos; void main(){ gl_Position = vec4(aPos,0.,1.); }
</script>

<!-- ============ shared prelude ============ -->
<script id="prelude" type="x-shader">#version 300 es
precision highp float;
uniform vec2 uRes;
uniform vec3 uCam, uTgt, uSun;
uniform float uFov, uVar, uSplit, uFocus, uAper;
uniform sampler2D uTex;
out vec4 fragOut;
#define PI 3.14159265
float hash11(float p){ p=fract(p*.1031); p*=p+33.33; p*=p+p; return fract(p); }
float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float hash13(vec3 p3){ p3=fract(p3*.1031); p3+=dot(p3,p3.zyx+31.32); return fract((p3.x+p3.y)*p3.z); }
vec2 hash22(vec2 p){ vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); p3+=dot(p3,p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
vec3 hash33(vec3 p3){ p3=fract(p3*vec3(.1031,.1030,.0973)); p3+=dot(p3,p3.yxz+33.33); return fract((p3.xxy+p3.yxx)*p3.zyx); }
float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash12(i),hash12(i+vec2(1,0)),u.x),mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),u.x),u.y); }
float vnoise3(vec3 p){ vec3 i=floor(p),f=fract(p); vec3 u=f*f*(3.-2.*f);
  return mix(mix(mix(hash13(i),hash13(i+vec3(1,0,0)),u.x),mix(hash13(i+vec3(0,1,0)),hash13(i+vec3(1,1,0)),u.x),u.y),
             mix(mix(hash13(i+vec3(0,0,1)),hash13(i+vec3(1,0,1)),u.x),mix(hash13(i+vec3(0,1,1)),hash13(i+vec3(1,1,1)),u.x),u.y),u.z); }
float fbm(vec2 p){ float s=0.,a=.5; for(int i=0;i<5;i++){ s+=a*vnoise(p); p=mat2(1.6,1.2,-1.2,1.6)*p+3.1; a*=.5; } return s; }
float fbm3(vec3 p){ float s=0.,a=.5; for(int i=0;i<4;i++){ s+=a*vnoise3(p); p=p*2.03+1.7; a*=.5; } return s; }
float ridged(vec2 p){ float s=0.,a=.5; for(int i=0;i<6;i++){ float n=1.-abs(vnoise(p)*2.-1.); s+=a*n*n; p=mat2(1.6,1.2,-1.2,1.6)*p+7.3; a*=.5; } return s; }
float smin(float a,float b,float k){ float h=clamp(.5+.5*(b-a)/k,0.,1.); return mix(b,a,h)-k*h*(1.-h); }
float sdBox(vec3 p, vec3 b){ vec3 q=abs(p)-b; return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.); }
float sdRoundBox(vec3 p, vec3 b, float r){ return sdBox(p,b-r)-r; }
float sdEll(vec3 p, vec3 r){ float k0=length(p/r), k1=length(p/(r*r)); return k0*(k0-1.)/k1; }
float sdCapsule(vec3 p, vec3 a, vec3 b, float r){ vec3 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h)-r; }
float sdCylY(vec3 p, float r, float h){ vec2 d=abs(vec2(length(p.xz),p.y))-vec2(r,h); return min(max(d.x,d.y),0.)+length(max(d,0.)); }
vec3 aces(vec3 x){ return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.); }
vec3 cFw, cRt, cUp;
vec3 camRay(vec2 fc){
  cFw=normalize(uTgt-uCam); cRt=normalize(cross(cFw,vec3(0,1,0))); cUp=cross(cRt,cFw);
  vec2 uv=(fc-.5*uRes)/(.5*uRes.y);
  return normalize(cFw+(uv.x*cRt+uv.y*cUp)*uFov);
}
</script>

<!-- ============ 1. DUNES (sunrise / golden) ============ -->
<script id="dunes" type="x-shader">
float duneH(vec2 p){
  vec2 w = p + vec2(fbm(p*0.012)*60., fbm(p*0.012+9.)*60.);
  float d = dot(w, normalize(vec2(1.0,0.35)))*0.018;
  float r = fract(d + 0.15*fbm(p*0.02));
  float prof = r<0.68 ? smoothstep(0.,0.68,r) : 1.0-smoothstep(0.68,1.0,r); // gentle windward, steep lee
  float big = pow(prof,1.3)*12.0*(0.55+0.6*fbm(p*0.006));
  float d2 = dot(p, normalize(vec2(0.3,1.0)))*0.12;
  float r2 = fract(d2+0.3*fbm(p*0.05));
  float small = (r2<0.7? smoothstep(0.,0.7,r2) : 1.-smoothstep(0.7,1.,r2))*1.1;
  return big + small*0.6 + fbm(p*0.08)*1.2 - 2.0;
}
float march(vec3 ro, vec3 rd, out bool hit){
  float t=1.0; hit=false;
  for(int i=0;i<260;i++){
    vec3 p=ro+rd*t; float h=p.y-duneH(p.xz);
    if(h<0.002*t){ hit=true; break; }
    t+=max(h*0.35,0.008*t); if(t>900.) break;
  }
  return t;
}
float shadow(vec3 ro, vec3 rd){
  float res=1., t=0.5;
  for(int i=0;i<60;i++){ vec3 p=ro+rd*t; float h=p.y-duneH(p.xz); res=min(res,8.*h/t); if(res<0.)break; t+=clamp(h*0.6,0.3,6.); if(t>250.)break; }
  return clamp(res,0.,1.);
}
vec3 skyCol(vec3 rd){
  float sd = max(dot(rd,uSun),0.);
  vec3 zen = mix(vec3(0.10,0.20,0.42), vec3(0.20,0.36,0.62), uVar);
  vec3 hor = mix(vec3(1.0,0.55,0.28), vec3(1.0,0.78,0.50), uVar);
  vec3 c = mix(hor, zen, pow(clamp(rd.y+0.02,0.,1.),0.45));
  c += vec3(1.0,0.55,0.25)*pow(sd,8.)*0.7 + vec3(1.0,0.75,0.45)*pow(sd,64.)*1.5;
  c += vec3(1.0,0.9,0.7)*smoothstep(0.9993,0.9997,sd)*30.;
  // thin high clouds
  vec2 cp = rd.xz/(rd.y+0.08)*2.0;
  float cl = smoothstep(0.55,0.85,fbm(cp*vec2(0.6,2.5)+vec2(3,1)))*smoothstep(0.0,0.15,rd.y);
  c = mix(c, mix(vec3(1.0,0.62,0.45),vec3(1.0,0.85,0.7),uVar)*(0.9+pow(sd,4.)), cl*0.55);
  // distant mesas
  float az = atan(rd.x,rd.z);
  float m = 0.012+0.022*fbm(vec2(az*9.,1.))+0.02*smoothstep(0.6,0.9,vnoise(vec2(az*4.,3.)));
  if(rd.y<m && rd.y>-0.05) c = mix(c, hor*0.55+zen*0.2, 0.75);
  return c;
}
vec4 render(vec3 ro, vec3 rd){
  bool hit; float t = march(ro,rd,hit);
  vec3 sky = skyCol(rd);
  if(!hit) return vec4(sky, -1.);
  vec3 p=ro+rd*t;
  float e=0.05*max(1.,t*0.02);
  vec3 n=normalize(vec3(duneH(p.xz-vec2(e,0))-duneH(p.xz+vec2(e,0)),2.*e,duneH(p.xz-vec2(0,e))-duneH(p.xz+vec2(0,e))));
  // wind ripples (fade with distance)
  float rip = sin(dot(p.xz,vec2(0.35,1.0))*9.0 + fbm(p.xz*0.7)*6.0);
  n = normalize(n + vec3(0.,0.,0.)+ vec3(rip*0.06,0.,rip*0.17)*exp(-t*0.03));
  vec3 alb = mix(vec3(0.80,0.52,0.30), vec3(0.88,0.66,0.42), fbm(p.xz*0.05))*(0.92+0.08*vnoise(p.xz*3.));
  float sh = shadow(p+n*0.05, uSun);
  float dif = max(dot(n,uSun),0.);
  vec3 sunC = mix(vec3(1.6,0.85,0.45), vec3(1.7,1.25,0.8), uVar)*2.2;
  vec3 skyA = mix(vec3(0.25,0.32,0.55), vec3(0.35,0.42,0.6), uVar)*0.55;
  vec3 col = alb*(sunC*dif*sh + skyA*(0.6+0.4*n.y) + vec3(0.5,0.3,0.15)*0.12*max(dot(n,-uSun*vec3(1,0,1)),0.));
  // sparkle of sand grains
  col += sunC*0.4*step(0.995,hash12(floor(p.xz*60.)))*sh*pow(dif,2.)*exp(-t*0.05);
  // aerial perspective
  float fog = 1.-exp(-t*0.0016);
  vec3 fogC = mix(skyCol(normalize(vec3(rd.x,0.07,rd.z))), vec3(1.0,0.6,0.35), 0.25)*0.92;
  col = mix(col, fogC, fog);
  return vec4(col, t*dot(rd,cFw));
}
</script>

<!-- ============ 2. MECCA VALLEY (dawn / pre-dawn) ============ -->
<script id="valley" type="x-shader">
float terrain(vec2 p){
  float v = abs(p.x - 12.*sin(p.y*0.012));          // valley axis
  float mask = smoothstep(18.,70.,v);
  float mt = ridged(p*0.018)*55.*mask + fbm(p*0.05)*4.*mask;
  return mt + fbm(p*0.06)*0.8 + 0.3*sin(p.x*0.05);
}
float houseD(vec3 p, out float id){
  vec2 cs = vec2(5.0,5.0);
  vec2 ci = floor(p.xz/cs); vec2 cf = p.xz - (ci+0.5)*cs;
  id = hash12(ci);
  float v = abs((ci.x+0.5)*cs.x - 12.*sin((ci.y+0.5)*cs.y*0.012));
  float zc = (ci.y+0.5)*cs.y;
  if(id<0.25 || v>16. || zc<-60. || zc>40.) return min(cs.x*0.5-abs(cf.x), cs.y*0.5-abs(cf.y))+0.3;
  vec2 hs = vec2(1.2+1.0*hash12(ci+3.1), 1.1+0.9*hash12(ci+7.7));
  float hh = 1.6+2.6*hash12(ci+11.3);
  vec2 off = (hash22(ci)-0.5)*(cs*0.5-hs-0.05)*2.;
  float g = terrain((ci+0.5)*cs);
  vec3 q = vec3(cf.x-off.x, p.y-g-hh*0.5+0.3, cf.y-off.y);
  float d = sdBox(q, vec3(hs.x,hh*0.5,hs.y));
  // roof parapet: hollow the top a little
  d = max(d, -sdBox(q-vec3(0,hh*0.5,0), vec3(hs.x-0.15,0.18,hs.y-0.15)));
  // annex
  if(hash12(ci+5.)>0.5){ vec3 q2=q-vec3(hs.x*0.6,-hh*0.25,hs.y*0.9); d=min(d,sdBox(q2,vec3(hs.x*0.45,hh*0.25,0.6))); }
  float bound = min(cs.x*0.5-abs(cf.x), cs.y*0.5-abs(cf.y))+0.3;
  return min(d, bound);
}
vec2 map(vec3 p){
  float t = (p.y-terrain(p.xz))*0.5;
  float id; float h = houseD(p,id);
  return h<t ? vec2(h,2.) : vec2(t,1.);
}
vec3 calcN(vec3 p){ vec2 e=vec2(0.01,0.); return normalize(vec3(map(p+e.xyy).x-map(p-e.xyy).x,map(p+e.yxy).x-map(p-e.yxy).x,map(p+e.yyx).x-map(p-e.yyx).x)); }
float shadow(vec3 ro, vec3 rd){ float res=1.,t=0.1; for(int i=0;i<70;i++){ float h=map(ro+rd*t).x; res=min(res,10.*h/t); if(res<0.)break; t+=clamp(h,0.05,4.); if(t>200.)break;} return clamp(res,0.,1.); }
vec3 skyCol(vec3 rd){
  float sd=max(dot(rd,normalize(uSun+vec3(0,0.05,0))),0.);
  vec3 zen = mix(vec3(0.16,0.27,0.50), vec3(0.03,0.05,0.13), uVar);
  vec3 hor = mix(vec3(1.0,0.62,0.36), vec3(0.65,0.32,0.22), uVar);
  vec3 c = mix(hor, zen, pow(clamp(rd.y+0.03,0.,1.),0.4));
  c += mix(vec3(1.,0.6,0.3),vec3(0.9,0.35,0.2),uVar)*pow(sd,6.)*0.8;
  if(uVar<0.5) c += vec3(1.,0.85,0.6)*smoothstep(0.9993,0.9997,max(dot(rd,uSun),0.))*25.;
  else { // stars
    vec2 sp = vec2(atan(rd.x,rd.z)*300., rd.y*300.);
    float st = step(0.997,hash12(floor(sp)))*smoothstep(0.15,0.4,rd.y);
    c += vec3(0.8,0.85,1.0)*st*0.8;
  }
  return c;
}
vec4 render(vec3 ro, vec3 rd){
  float t=0.5; vec2 h; bool hit=false;
  for(int i=0;i<300;i++){ h=map(ro+rd*t); if(h.x<0.001*t){hit=true;break;} t+=h.x*0.9; if(t>700.)break; }
  vec3 sky=skyCol(rd);
  if(!hit) return vec4(sky,-1.);
  vec3 p=ro+rd*t; vec3 n=calcN(p);
  vec3 alb;
  float night = uVar;
  vec3 sunC = mix(vec3(1.7,1.0,0.6)*2.0, vec3(0.0), night);
  vec3 skyA = mix(vec3(0.35,0.42,0.62)*0.6, vec3(0.20,0.25,0.45)*0.45, night);
  vec3 emit = vec3(0);
  if(h.y<1.5){
    alb = mix(vec3(0.42,0.30,0.22), vec3(0.62,0.45,0.30), fbm(p.xz*0.1)) * (0.8+0.3*vnoise(p.xz*2.));
    alb = mix(alb, vec3(0.70,0.55,0.38), smoothstep(0.7,0.9,n.y)*0.5);
  } else {
    float id; houseD(p,id);
    alb = mix(vec3(0.72,0.56,0.40), vec3(0.62,0.46,0.33), hash11(id*13.))*(0.85+0.25*fbm(p.xy*3.+p.zz));
    // windows / doors
    vec2 wc = abs(n.x)>0.5 ? p.zy : p.xy;
    vec2 wg = vec2(fract(wc.x*0.55+id*3.),fract(wc.y*0.5+0.3));
    float win = step(abs(wg.x-0.5),0.09)*step(abs(wg.y-0.5),0.13)*step(0.3,hash12(floor(vec2(wc.x*0.55+id*3.,wc.y*0.5+0.3))))*step(abs(n.y),0.5);
    alb *= 1.-0.85*win;
    if(night>0.5 && win>0.5 && hash12(floor(vec2(wc.x*0.55+id*3.,wc.y*0.5)))>0.82) emit = vec3(1.0,0.55,0.2)*1.6;
  }
  float sh = night>0.5 ? 0. : shadow(p+n*0.02,uSun);
  float dif=max(dot(n,uSun),0.);
  float ao = clamp(map(p+n*0.6).x/0.6,0.,1.)*0.5+0.5;
  vec3 col = alb*(sunC*dif*sh + skyA*(0.5+0.5*n.y)*ao + mix(vec3(0.4,0.25,0.15)*0.15,vec3(0.3,0.15,0.1)*0.10,night)) + emit;
  float fog = 1.-exp(-t*mix(0.0022,0.0030,night));
  vec3 fogC = mix(mix(vec3(0.95,0.68,0.48),vec3(0.18,0.20,0.32),night), sky, 0.3);
  col = mix(col, fogC, fog);
  // low valley mist
  col = mix(col, fogC*1.05, smoothstep(4.,0.,p.y)*0.15*fog);
  return vec4(col, t*dot(rd,cFw));
}
</script>

<!-- ============ 3. ALLEY ============ -->
<script id="alley" type="x-shader">
float wallX(float z, float side){ return 1.45 + 0.08*sin(z*0.7+side*3.) + 0.25*step(0.6,hash11(floor(z/3.)+side*17.)); }
float wallTop(float z, float side){ return 3.2 + 1.8*hash11(floor(z/3.5)+side*31.); }
vec2 map(vec3 p){
  float side = p.x>0.?1.:-1.;
  float wx = wallX(p.z,side);
  float g = p.y + 0.02*fbm(p.xz*3.);
  float wall = max(wx-abs(p.x), p.y-wallTop(p.z,side));
  wall += 0.012*fbm(p.yz*4.);
  float dz = mod(p.z,7.)-3.5;
  float door = sdBox(vec3(abs(p.x)-wx, p.y-1.05, dz), vec3(0.14,1.05,0.55));
  wall = max(wall,-door);
  float d=g, m=1.; if(wall<d){d=wall;m=2.;}
  // wooden beams sticking out near the top
  vec3 bq = vec3(abs(p.x)-wx+0.10, p.y-(wallTop(p.z,side)-0.35), mod(p.z,0.9)-0.45);
  float beam = sdBox(bq, vec3(0.22,0.06,0.06));
  if(beam<d){ d=beam; m=3.; }
  // door panels
  float panel = sdBox(vec3(abs(p.x)-wx-0.10, p.y-1.0, dz), vec3(0.02,1.0,0.5));
  if(panel<d){ d=panel; m=4.; }
  // awning cloth
  float az = p.z-9.0;
  float sag = 3.05 - 0.35*(1.-pow(p.x/1.5,2.)) + 0.04*sin(p.x*6.+p.z*4.);
  float cloth = max(abs(p.y-sag)-0.01, max(abs(az)-1.1, abs(p.x)-1.6));
  if(cloth<d){ d=cloth; m=5.; }
  // clay jars
  vec3 jq = p - vec3(-1.15,0.35,5.2);
  float jar = sdEll(jq, vec3(0.28,0.36,0.28));
  jar = smin(jar, sdCylY(jq-vec3(0,0.4,0),0.1,0.08),0.05);
  vec3 jq2 = p - vec3(-1.05,0.25,5.85);
  jar = min(jar, sdEll(jq2, vec3(0.2,0.26,0.2)));
  if(jar<d){ d=jar; m=6.; }
  return vec2(d,m);
}
vec3 calcN(vec3 p){ vec2 e=vec2(0.002,0.); return normalize(vec3(map(p+e.xyy).x-map(p-e.xyy).x,map(p+e.yxy).x-map(p-e.yxy).x,map(p+e.yyx).x-map(p-e.yyx).x)); }
float shadow(vec3 ro, vec3 rd){ float res=1.,t=0.02; for(int i=0;i<80;i++){ float h=map(ro+rd*t).x; res=min(res,12.*h/t); if(res<0.)break; t+=clamp(h,0.02,0.5); if(t>30.)break;} return clamp(res,0.,1.); }
vec4 render(vec3 ro, vec3 rd){
  float t=0.05; vec2 h; bool hit=false;
  for(int i=0;i<220;i++){ h=map(ro+rd*t); if(abs(h.x)<0.0005*t){hit=true;break;} t+=h.x*0.7; if(t>80.)break; }
  vec3 sky = mix(vec3(0.95,0.85,0.70), vec3(0.45,0.62,0.85), clamp(rd.y*1.5,0.,1.));
  if(!hit) return vec4(sky*1.6,-1.);
  vec3 p=ro+rd*t; vec3 n=calcN(p);
  vec3 alb; float spec=0.;
  if(h.y<1.5){ alb = vec3(0.62,0.50,0.37)*(0.8+0.3*fbm(p.xz*2.))+0.05*step(0.97,hash12(floor(p.xz*30.))); }
  else if(h.y<2.5){ // mud brick plaster
    alb = vec3(0.74,0.58,0.42)*(0.75+0.35*fbm(p.yz*1.5+p.x));
    vec2 b = vec2(p.z*2.2 + step(0.5,fract(p.y*3.))*0.5, p.y*3.);
    float mortar = smoothstep(0.04,0.0,min(fract(b.x),fract(b.y)));
    alb *= 1.0-0.18*mortar*smoothstep(0.4,0.7,fbm(p.yz*0.8));
  }
  else if(h.y<3.5){ alb = vec3(0.30,0.20,0.12)*(0.7+0.4*vnoise(p.xz*20.)); }
  else if(h.y<4.5){ alb = vec3(0.32,0.20,0.11)*(0.6+0.4*fract(p.z*8.)+0.2*vnoise(vec2(p.z*30.,p.y*2.))); spec=0.1; }
  else if(h.y<5.5){ float s = step(0.5,fract(p.x*2.2)); alb = mix(vec3(0.55,0.12,0.08), vec3(0.85,0.75,0.55), s)*(0.85+0.15*vnoise(p.xz*40.)); }
  else { alb = vec3(0.62,0.35,0.20)*(0.8+0.25*fbm(p.xy*8.)); spec=0.15; }
  float sh = shadow(p+n*0.01,uSun);
  float dif = max(dot(n,uSun),0.);
  vec3 sunC = vec3(1.9,1.45,1.0)*2.0;
  float sky_vis = clamp(0.35+0.65*n.y,0.,1.)*clamp((p.y+0.5)/3.,0.3,1.);
  vec3 col = alb*(sunC*dif*sh + vec3(0.45,0.55,0.75)*0.38*sky_vis + vec3(0.6,0.42,0.28)*0.14);
  if(h.y>4.5 && h.y<5.5){ col += alb*sunC*0.35*max(dot(-n,uSun),0.); } // translucent cloth
  col += spec*sunC*pow(max(dot(reflect(rd,n),uSun),0.),20.)*sh;
  col = mix(col, vec3(0.95,0.82,0.65), 1.-exp(-t*0.014));
  return vec4(col, t*dot(rd,cFw));
}
</script>

<!-- ============ 4. MOUNTAIN PATH & CAVE (pre-dawn) ============ -->
<script id="cave" type="x-shader">
float pathX(float z){ return 3.0*sin(z*0.08)+1.5*sin(z*0.23); }
const vec3 CAVE = vec3(4.0, 25.6, 38.0);
float terrainH(vec2 p){
  float slope = smoothstep(4.,50.,p.y)*26.0;
  float h = slope + ridged(p*0.035)*9.0*smoothstep(0.,25.,p.y) + ridged(p*0.15)*1.5 + fbm(p*0.6)*0.4;
  float pm = smoothstep(1.1,0.3,abs(p.x-pathX(p.y)))*smoothstep(36.,30.,p.y);
  h -= pm*0.35;
  float dc = length((p-CAVE.xz)*vec2(1.,1.4));
  h = mix(h, 24.4, smoothstep(7.,3.,dc));           // ledge in front of the cave
  return h;
}
vec2 map(vec3 p){
  float d = (p.y-terrainH(p.xz))*0.55;
  float m = 1.;
  // rock mass above the cave mouth
  vec3 rq = p-(CAVE+vec3(0.,1.6,2.0));
  float rock = sdEll(rq, vec3(5.5,3.4,3.8)) + 1.1*fbm3(p*0.55) + 0.3*fbm3(p*2.6) - 0.5;
  d = smin(d, rock, 1.0);
  float c = sdEll(p-CAVE, vec3(1.6,1.3,3.0)) + 0.1*fbm3(p*2.);
  d = max(d, -c);
  // boulders
  vec2 ci = floor(p.xz/6.); vec2 cf = mod(p.xz,6.)-3.;
  float hb = hash12(ci);
  if(hb>0.72){
    vec2 o=(hash22(ci+4.)-0.5)*2.5; float r=0.6+1.2*hash12(ci+9.);
    vec3 bq=vec3(cf.x-o.x, p.y-terrainH((ci+0.5)*6.)-r*0.25, cf.y-o.y);
    float bb = sdEll(bq, vec3(r,r*0.7,r*0.85)) + 0.15*fbm3(p*2.);
    if(bb<d){ d=bb; m=2.; }
  }
  return vec2(d,m);
}
vec3 calcN(vec3 p){ vec2 e=vec2(0.01,0.); return normalize(vec3(map(p+e.xyy).x-map(p-e.xyy).x,map(p+e.yxy).x-map(p-e.yxy).x,map(p+e.yyx).x-map(p-e.yyx).x)); }
float shadow(vec3 ro, vec3 rd){ float res=1.,t=0.05; for(int i=0;i<60;i++){ float h=map(ro+rd*t).x; res=min(res,10.*h/t); if(res<0.)break; t+=clamp(h,0.05,3.); if(t>120.)break;} return clamp(res,0.,1.); }
vec3 skyCol(vec3 rd){
  vec3 c = mix(vec3(0.85,0.50,0.38), vec3(0.06,0.10,0.24), pow(clamp(rd.y+0.02,0.,1.),0.35));
  c += vec3(1.0,0.55,0.3)*pow(max(dot(rd,normalize(uSun*vec3(1,0,1)+vec3(0,0.02,0))),0.),5.)*0.6;
  vec2 sp = vec2(atan(rd.x,rd.z)*400., rd.y*400.);
  c += vec3(0.85,0.9,1.0)*step(0.9975,hash12(floor(sp)))*smoothstep(0.2,0.5,rd.y)*0.9;
  return c;
}
vec4 render(vec3 ro, vec3 rd){
  float t=0.2; vec2 h; bool hit=false;
  for(int i=0;i<260;i++){ h=map(ro+rd*t); if(h.x<0.0006*t){hit=true;break;} t+=h.x*0.8; if(t>400.)break; }
  vec3 sky=skyCol(rd);
  if(!hit) return vec4(sky,-1.);
  vec3 p=ro+rd*t; vec3 n=calcN(p);
  vec3 alb = mix(vec3(0.40,0.30,0.23), vec3(0.58,0.44,0.33), fbm(p.xz*0.25+p.y*0.3))*(0.65+0.5*fbm3(p*vec3(1.5,4.,1.5)));
  float pm = smoothstep(1.0,0.3,abs(p.x-pathX(p.z)))*step(h.y,1.5);
  alb = mix(alb, vec3(0.62,0.52,0.40), pm*0.6);
  float sh = shadow(p+n*0.02,uSun);
  float dif = max(dot(n,uSun),0.);
  vec3 sunC = vec3(1.8,0.9,0.5)*1.6;            // first light on the high rocks
  float occ = clamp(map(p+n*0.8).x/0.8,0.,1.);
  float caveDark = smoothstep(0.5,3.0,length((p-CAVE)/vec3(1.8,1.3,1.)));
  vec3 col = alb*(sunC*dif*sh + vec3(0.25,0.33,0.60)*0.55*(0.5+0.5*n.y)*occ*caveDark + vec3(0.25,0.15,0.1)*0.05);
  col *= mix(0.15,1.0,caveDark);
  float fog = 1.-exp(-t*0.012);
  col = mix(col, vec3(0.30,0.32,0.48), fog);
  return vec4(col, t*dot(rd,cFw));
}
</script>

<!-- ============ 5. PROVISIONS STILL LIFE (water skin, food bundle, dates, belt) ============ -->
<script id="still" type="x-shader">
float beltCurve(float x){ return 0.035*sin(x*3.1+0.5)+0.02*sin(x*7.3); }
float sdBelt(vec3 p, out float side, out vec2 buv){
  // belt lies along x, width ~0.09; when split two strips move apart in z
  float zc = beltCurve(p.x) + 0.32;
  float y0 = 0.006 + 0.004*sin(p.x*11.)*sin(p.x*3.);
  float lz = p.z - zc;
  float gap = uSplit*0.035;
  float hw = 0.045;
  float d;
  if(uSplit<0.01){
    d = sdBox(vec3(p.x+0.05, p.y-y0, lz), vec3(0.62, 0.004, hw)) - 0.002;
    side = 0.; buv = vec2(p.x, (lz+hw)/(2.*hw));
  } else {
    float s = lz>0.? 1.:-1.;
    float zz = lz - s*(gap*0.5 + hw*0.5);
    // the far strip is slightly rotated / curled
    float yy = p.y - y0 - (s>0.? 0.003*sin(p.x*9.):0.);
    d = sdBox(vec3(p.x+0.05+(s>0.?0.02:0.), yy, zz), vec3(0.62, 0.004, hw*0.5-0.002)) - 0.002;
    side = s; buv = vec2(p.x, (s<0.? (zz+hw*0.5)/(2.*hw) : 0.5+(zz+hw*0.5)/(2.*hw)));
  }
  return d;
}
vec2 map(vec3 p){
  float d = p.y + 0.002*fbm(p.xz*40.); float m=1.;            // ground: palm mat
  // water skin (mesh)
  vec3 q = p-vec3(-0.30,0.13,-0.05);
  float ws = sdEll(q, vec3(0.27,0.12,0.17));
  ws = smin(ws, sdCapsule(q, vec3(0.22,0.02,0.0), vec3(0.36,0.10,0.03), 0.04), 0.05);
  ws += 0.004*fbm3(q*30.);
  if(ws<d){ d=ws; m=2.; }
  // food bundle (cloth wrapped)
  vec3 b = p-vec3(0.28,0.11,-0.12);
  float bd = sdEll(b, vec3(0.19,0.10,0.16)) + 0.004*sin(atan(b.z,b.x)*9.+b.y*20.);
  bd = smin(bd, sdEll(b-vec3(0.0,0.11,0.0), vec3(0.05,0.05,0.05)), 0.04);       // knot
  bd = smin(bd, sdEll(b-vec3(0.05,0.14,0.02), vec3(0.06,0.025,0.03)), 0.02);
  if(bd<d){ d=bd; m=3.; }
  // wooden bowl with dates
  vec3 w = p-vec3(0.02,0.05,0.12);
  float bowl = max(sdEll(w, vec3(0.13,0.06,0.13)), -sdEll(w-vec3(0,0.012,0), vec3(0.118,0.055,0.118)));
  bowl = max(bowl, w.y-0.03);
  if(bowl<d){ d=bowl; m=4.; }
  for(int i=0;i<7;i++){
    float fi=float(i); vec2 o = (hash22(vec2(fi,3.))-0.5)*0.15;
    vec3 dq = w - vec3(o.x, 0.005+0.015*hash11(fi*7.), o.y);
    float a = hash11(fi*3.)*6.28; dq.xz = mat2(cos(a),-sin(a),sin(a),cos(a))*dq.xz;
    float dt = sdEll(dq, vec3(0.032,0.016,0.017));
    if(dt<d){ d=dt; m=5.; }
  }
  float side; vec2 buv;
  float bl = sdBelt(p, side, buv);
  if(bl<d){ d=bl; m=6.; }
  return vec2(d,m);
}
vec3 calcN(vec3 p){ vec2 e=vec2(0.0005,0.); return normalize(vec3(map(p+e.xyy).x-map(p-e.xyy).x,map(p+e.yxy).x-map(p-e.yxy).x,map(p+e.yyx).x-map(p-e.yyx).x)); }
float shadow(vec3 ro, vec3 rd){ float res=1.,t=0.005; for(int i=0;i<64;i++){ float h=map(ro+rd*t).x; res=min(res,14.*h/t); if(res<0.)break; t+=clamp(h,0.003,0.08); if(t>3.)break;} return clamp(res,0.,1.); }
vec3 beltTex(vec2 uv, vec3 p){
  // woven band: indigo / madder red / undyed stripes along the length
  float v = uv.y;
  vec3 c = vec3(0.80,0.70,0.52);
  if(abs(v-0.5)<0.20) c = vec3(0.58,0.12,0.08);
  if(abs(v-0.5)<0.07) c = vec3(0.12,0.16,0.32);
  if(abs(v-0.12)<0.03 || abs(v-0.88)<0.03) c = vec3(0.12,0.16,0.32);
  float diamond = step(abs(fract(uv.x*14.)-0.5)+abs(v-0.5)*1.8,0.14);
  c = mix(c, vec3(0.85,0.75,0.55), diamond*step(abs(v-0.5),0.2));
  float weave = 0.85+0.15*sin(uv.x*900.)*sin(v*120.);
  return c*weave*(0.85+0.15*vnoise(uv*vec2(60.,8.)));
}
vec4 render(vec3 ro, vec3 rd){
  float t=0.01; vec2 h; bool hit=false;
  for(int i=0;i<200;i++){ h=map(ro+rd*t); if(h.x<0.0002*t+0.00005){hit=true;break;} t+=h.x*0.8; if(t>10.)break; }
  if(!hit) return vec4(vec3(0.02),-1.);
  vec3 p=ro+rd*t; vec3 n=calcN(p);
  vec3 alb; float spec=0.05, gloss=8.;
  if(h.y<1.5){ // palm-leaf mat
    vec2 g = p.xz*vec2(42.,42.);
    float wv = step(0.5,fract(floor(g.x)*0.5+floor(g.y)*0.5));
    float strand = wv>0.5 ? fract(g.x) : fract(g.y);
    alb = vec3(0.55,0.42,0.26)*(0.7+0.3*sin(strand*PI))*(0.8+0.3*vnoise(p.xz*30.));
  } else if(h.y<2.5){ alb = vec3(0.20,0.11,0.05)*(0.7+0.45*fbm3(p*60.)); spec=0.3; gloss=24.; }
  else if(h.y<3.5){ float fold = 0.5+0.5*sin(atan(p.z+0.12,p.x-0.28)*9.+fbm3(p*12.)*3.); alb = vec3(0.60,0.50,0.36)*(0.85+0.15*sin(p.x*900.)*sin(p.z*900.))*(0.7+0.3*fold); }
  else if(h.y<4.5){ alb = vec3(0.40,0.24,0.12)*(0.75+0.35*sin(length(p.xz-vec2(0.02,0.12))*300.+fbm(p.xz*40.)*4.)); spec=0.15; gloss=16.; }
  else if(h.y<5.5){ alb = vec3(0.22,0.08,0.04)*(0.8+0.3*vnoise3(p*200.)); spec=0.5; gloss=40.; }
  else { float side; vec2 buv; sdBelt(p,side,buv); alb = beltTex(buv,p);
    // frayed threads along the torn edge
    if(uSplit>0.01){ float edge = side<0.? 1.-buv.y*2. : (buv.y-0.5)*2.; alb *= mix(1.0, 0.75+0.5*hash12(vec2(floor(p.x*700.),0.)), smoothstep(0.08,0.0,edge)); }
  }
  vec3 L = uSun;
  float sh = shadow(p+n*0.002,L);
  float dif = max(dot(n,L),0.);
  vec3 sunC = vec3(2.2,1.6,1.05)*1.6;
  float ao = clamp(map(p+n*0.03).x/0.03,0.,1.)*0.6+0.4;
  vec3 col = alb*(sunC*dif*sh + vec3(0.30,0.32,0.40)*0.35*ao + vec3(0.5,0.35,0.2)*0.12*ao);
  col += spec*sunC*pow(max(dot(reflect(rd,n),L),0.),gloss)*sh;
  // light pool falloff (doorway light)
  col *= smoothstep(1.4,0.2,length(p.xz-vec2(-0.05,0.05)));
  return vec4(col, t*dot(rd,cFw));
}
</script>

<!-- ============ 6. WRITING DESK (manuscript, ink, qalam, oil lamp) ============ -->
<script id="desk" type="x-shader">
const vec3 LAMP = vec3(0.42,0.17,-0.18);
float pageY(vec2 xz){ return 0.0165 + 0.010*smoothstep(0.15,0.32,abs(xz.x)) + 0.002*sin(xz.y*12.); }
vec2 map(vec3 p){
  float d = p.y; float m=1.;                                     // desk
  vec3 pq = vec3(p.x, p.y-pageY(p.xz), p.z);
  float page = sdBox(pq, vec3(0.32,0.0015,0.22));
  if(page<d){ d=page; m=2.; }
  float under = sdBox(vec3(p.x+0.03,p.y-0.006,p.z+0.04), vec3(0.34,0.006,0.24));   // book under the page
  if(under<d){ d=under; m=7.; }
  // inkwell
  vec3 iq = p-vec3(-0.43,0.0,-0.12);
  float ink = sdCylY(iq-vec3(0,0.05,0), 0.055, 0.05) - 0.008;
  ink = smin(ink, sdCylY(iq-vec3(0,0.105,0),0.03,0.012),0.01);
  ink = max(ink, -sdCylY(iq-vec3(0,0.11,0),0.022,0.02));
  if(ink<d){ d=ink; m=3.; }
  float inkS = sdCylY(iq-vec3(0,0.085,0),0.022,0.002);
  if(inkS<d){ d=inkS; m=4.; }
  // reed pen (qalam)
  vec3 a = vec3(-0.30,0.02,0.10), b = vec3(0.05,0.006,0.20);
  float pen = sdCapsule(p, a, b, 0.006);
  if(pen<d){ d=pen; m=5.; }
  // clay oil lamp
  vec3 lq = p-vec3(0.45,0.0,-0.20);
  float lamp = sdEll(lq-vec3(0,0.03,0), vec3(0.08,0.035,0.06));
  lamp = smin(lamp, sdEll(lq-vec3(-0.06,0.035,0.0), vec3(0.05,0.015,0.02)),0.02);
  lamp = max(lamp, -sdEll(lq-vec3(0.0,0.07,0), vec3(0.025,0.02,0.025)));
  if(lamp<d){ d=lamp; m=6.; }
  // second closed book (copy) at the left
  vec3 bk = p-vec3(-0.15,0.025,-0.40);
  float book = sdRoundBox(bk, vec3(0.20,0.025,0.14),0.006);
  if(book<d){ d=book; m=8.; }
  return vec2(d,m);
}
vec3 calcN(vec3 p){ vec2 e=vec2(0.0004,0.); return normalize(vec3(map(p+e.xyy).x-map(p-e.xyy).x,map(p+e.yxy).x-map(p-e.yxy).x,map(p+e.yyx).x-map(p-e.yyx).x)); }
float shadowTo(vec3 ro, vec3 tgt){ vec3 rd=normalize(tgt-ro); float maxT=length(tgt-ro)-0.02; float res=1.,t=0.004; for(int i=0;i<50;i++){ float h=map(ro+rd*t).x; res=min(res,16.*h/t); if(res<0.)break; t+=clamp(h,0.002,0.05); if(t>maxT)break;} return clamp(res,0.,1.); }
vec4 render(vec3 ro, vec3 rd){
  float t=0.01; vec2 h; bool hit=false;
  for(int i=0;i<200;i++){ h=map(ro+rd*t); if(h.x<0.00015*t+0.00003){hit=true;break;} t+=h.x*0.85; if(t>8.)break; }
  if(!hit) return vec4(vec3(0.01,0.008,0.006),-1.);
  vec3 p=ro+rd*t; vec3 n=calcN(p);
  vec3 alb; float spec=0.05, gloss=10.;
  if(h.y<1.5){ // dark walnut desk
    float g = sin((p.z+0.03*fbm(p.xz*6.))*260.+fbm(p.xz*vec2(3.,40.))*6.);
    alb = vec3(0.22,0.12,0.06)*(0.75+0.25*g)*(0.8+0.3*fbm(p.xz*vec2(2.,30.))); spec=0.15; gloss=25.;
  } else if(h.y<2.5){
    vec4 tx = texture(uTex, vec2(0.5+p.x/0.64, 0.5-p.z/0.44));
    vec3 parch = vec3(0.86,0.76,0.58)*(0.82+0.22*fbm(p.xz*14.))*(1.-0.25*smoothstep(0.24,0.33,abs(p.x))-0.2*smoothstep(0.16,0.23,abs(p.z)));
    alb = mix(parch, tx.rgb, tx.a);
  } else if(h.y<3.5){ alb = vec3(0.10,0.18,0.22)*(0.85+0.2*fbm3(p*40.)); spec=0.6; gloss=60.; }
  else if(h.y<4.5){ alb = vec3(0.01); spec=0.9; gloss=200.; }
  else if(h.y<5.5){ alb = vec3(0.55,0.42,0.22)*(0.8+0.2*sin(length(p.xz)*400.)); spec=0.2; gloss=20.;
                    if(dot(p-vec3(0.05,0.006,0.20),normalize(vec3(-0.35,0.014,-0.10)))<0.02) alb*=0.15; }
  else if(h.y<6.5){ alb = vec3(0.55,0.30,0.16)*(0.8+0.3*fbm3(p*30.)); }
  else if(h.y<7.5){ alb = vec3(0.30,0.12,0.07)*(0.8+0.2*fbm3(p*60.)); }
  else { alb = vec3(0.35,0.14,0.08)*(0.7+0.3*fbm3(p*50.)); spec=0.2; gloss=12.;
         if(abs(p.y-0.05)<0.012 && abs(p.x+0.15)<0.19) alb = vec3(0.8,0.75,0.6)*(0.8+0.2*sin(p.y*3000.)); }
  vec3 Lp = LAMP + vec3(0.0,0.03,0.0);
  vec3 L = normalize(Lp-p); float dist = length(Lp-p);
  float sh = shadowTo(p+n*0.002, Lp);
  vec3 lampC = vec3(2.6,1.35,0.55)*0.32/(dist*dist+0.02);
  vec3 col = alb*(lampC*max(dot(n,L),0.)*sh + vec3(0.10,0.11,0.16)*0.18 + vec3(0.25,0.18,0.12)*0.08*uVar);
  col += spec*lampC*pow(max(dot(reflect(rd,n),L),0.),gloss)*sh;
  // window light from the left for variant 1 (daylight study)
  if(uVar>0.5){ vec3 Ls = normalize(vec3(-0.8,0.6,0.3)); col += alb*vec3(1.3,1.1,0.9)*0.8*max(dot(n,Ls),0.)*shadowTo(p+n*0.002,p+Ls*2.); }
  return vec4(col, t*dot(rd,cFw));
}
</script>

<!-- ============ 7. PALM-TRUNK HALL (early Madina style) with light shafts ============ -->
<script id="hall" type="x-shader">
const float ROOF = 3.6;
float roofGap(vec2 xz){
  float g = smoothstep(0.40,0.48,abs(fract(xz.x*0.55+0.25*fbm(xz*0.4))-0.5))*smoothstep(0.45,0.6,vnoise(xz*0.5+3.));
  g += smoothstep(0.80,0.86,vnoise(xz*1.3+11.))*0.9;
  return clamp(g,0.,1.);
}
vec2 map(vec3 p){
  float d = p.y; float m=1.;
  float roof = ROOF+0.2 - p.y; roof = -roof; roof = max(abs(p.y-ROOF-0.1)-0.1,0.);
  if(roof<d){ d=roof; m=2.; }
  vec2 cs = vec2(3.0,3.2);
  vec2 ci = floor((p.xz+vec2(1.5,1.6))/cs);
  vec2 cq = (p.xz+vec2(1.5,1.6)) - (ci+0.5)*cs;
  float col = length(cq) - 0.19 - 0.01*sin(p.y*30.+hash12(ci)*6.);
  col = max(col, p.y-ROOF);
  if(abs(ci.x)<0.5 && ci.y>-1.) col = 1e3;   // central aisle free
  if(col<d){ d=col; m=3.; }
  // back wall
  float wall = 14.0 - p.z;
  if(wall<d){ d=wall; m=4.; }
  // mats with manuscripts in a circle (halqa)
  vec3 mq = p-vec3(0.0,0.,5.5);
  float mat = sdBox(mq-vec3(0,0.005,0), vec3(1.6,0.005,1.3));
  if(mat<d){ d=mat; m=5.; }
  for(int i=0;i<6;i++){
    float a = float(i)/6.*6.283+0.3;
    vec3 sq = mq - vec3(cos(a)*1.05,0.03,sin(a)*0.85);
    float cushion = sdRoundBox(sq, vec3(0.28,0.03,0.22),0.03);
    if(cushion<d){ d=cushion; m=6.+float(i)*0.01; }
    vec3 pg = mq - vec3(cos(a)*0.6,0.012,sin(a)*0.48);
    float r = a+1.5708; pg.xz = mat2(cos(r),-sin(r),sin(r),cos(r))*pg.xz;
    float pgd = sdBox(pg, vec3(0.13,0.002,0.09));
    if(pgd<d){ d=pgd; m=7.; }
  }
  vec3 iq = mq-vec3(0.0,0.04,0.0);
  float inkw = sdCylY(iq,0.04,0.04);
  if(inkw<d){ d=inkw; m=8.; }
  return vec2(d,m);
}
vec3 calcN(vec3 p){ vec2 e=vec2(0.002,0.); return normalize(vec3(map(p+e.xyy).x-map(p-e.xyy).x,map(p+e.yxy).x-map(p-e.yxy).x,map(p+e.yyx).x-map(p-e.yyx).x)); }
float sunVis(vec3 p){ // light reaching p through the roof gaps
  float tr = (ROOF - p.y)/uSun.y; if(tr<0.) return 1.;
  vec3 r = p + uSun*tr;
  float gap = roofGap(r.xz);
  // columns occlusion (cheap)
  float t=0.05, res=1.;
  for(int i=0;i<24;i++){ vec3 q=p+uSun*t; if(q.y>ROOF) break; float h=map(q).x; res=min(res,12.*h/t); if(res<0.) break; t+=clamp(h,0.05,0.5); }
  return gap*clamp(res,0.,1.);
}
vec4 render(vec3 ro, vec3 rd){
  float t=0.05; vec2 h; bool hit=false;
  for(int i=0;i<200;i++){ h=map(ro+rd*t); if(h.x<0.0004*t){hit=true;break;} t+=h.x*0.9; if(t>40.)break; }
  vec3 p=ro+rd*t;
  vec3 col;
  vec3 sunC = vec3(2.2,1.65,1.1)*2.4;
  if(hit){
    vec3 n=calcN(p);
    vec3 alb;
    if(h.y<1.5){ alb = vec3(0.60,0.47,0.33)*(0.75+0.35*fbm(p.xz*1.5)); }
    else if(h.y<2.5){ alb = vec3(0.30,0.22,0.14)*(0.6+0.4*fbm(p.xz*vec2(8.,1.))); }
    else if(h.y<3.5){ float a=atan(p.z,p.x); alb = vec3(0.40,0.29,0.18)*(0.85+0.15*smoothstep(0.3,0.7,fract(p.y*5.+0.3*fbm(vec2(a*2.,p.y)))))*(0.7+0.4*fbm(vec2(a*4.,p.y*6.))); }
    else if(h.y<4.5){ alb = vec3(0.66,0.52,0.38)*(0.7+0.4*fbm(p.xy*1.2)); }
    else if(h.y<5.5){ vec2 g=p.xz*12.; alb = vec3(0.62,0.48,0.28)*(0.75+0.25*sin(g.x*PI)*sin(g.y*0.5)); }
    else if(h.y<6.9){ alb = mix(vec3(0.45,0.12,0.08), vec3(0.15,0.20,0.35), step(0.5,hash11(floor(h.y*100.))))*(0.8+0.2*fbm3(p*30.)); }
    else if(h.y<7.5){ alb = vec3(0.85,0.76,0.58); float ln = step(0.6,fract(p.z*60.+p.x*60.))*0.0; alb*=1.-ln; }
    else { alb = vec3(0.12,0.10,0.09); }
    float vis = sunVis(p+n*0.01);
    float dif = max(dot(n,uSun),0.);
    vec3 amb = vec3(0.55,0.45,0.35)*0.16*(0.6+0.4*n.y);
    // bounce light from sunlit patches on the floor
    amb += vec3(0.6,0.45,0.3)*0.10*smoothstep(1.5,0.0,p.y);
    col = alb*(sunC*dif*vis + amb);
    if(h.y>3.5&&h.y<4.5){ // windows in back wall
      vec2 wq = vec2(fract(p.x/3.0)-0.5, p.y-2.4);
      if(abs(wq.x)<0.07 && abs(wq.y)<0.45) col = vec3(2.4,2.0,1.5);
    }
  } else { col = vec3(0.05); }
  // volumetric light shafts
  float acc=0.;
  float tm = min(t, 25.);
  float j = hash12(gl_FragCoord.xy);
  for(int i=0;i<48;i++){
    float s = (float(i)+j)/48.*tm;
    vec3 q = ro+rd*s;
    if(q.y>ROOF) continue;
    float tr = (ROOF-q.y)/uSun.y;
    acc += roofGap((q+uSun*tr).xz);
  }
  acc *= tm/48.;
  float phase = 0.4+0.6*pow(max(dot(rd,uSun),0.),3.);
  col += vec3(1.0,0.78,0.52)*acc*0.05*phase;
  col += vec3(0.25,0.18,0.12)*0.02*tm*0.1;
  return vec4(col, hit? t*dot(rd,cFw) : -1.);
}
</script>

<!-- ============ 8. ARCADE with geometric screens (golden hour) ============ -->
<script id="arches" type="x-shader">
float star8(vec2 p){ // distance-ish to an 8-point star lattice (girih-like)
  p = fract(p)-0.5;
  vec2 q = abs(p);
  float sq = max(q.x,q.y);
  vec2 r = vec2(q.x+q.y, abs(q.x-q.y))*0.7071;
  float sq2 = max(r.x,r.y);
  float star = min(sq, sq2);
  return abs(star-0.33);
}
float archOpen(vec2 q, float w, float h){ // q.x horizontal, q.y vertical; pointed arch hole
  float rect = max(abs(q.x)-w, q.y-h);
  rect = max(rect, -q.y);
  vec2 c1 = vec2(-w*0.35, h), c2 = vec2(w*0.35, h);
  float R = w*1.35;
  float arc = max(length(q-c1)-R, length(q-c2)-R);
  arc = max(arc, h-q.y);
  return min(rect, arc);
}
vec2 map(vec3 p){
  float d = p.y; float m=1.;
  // right arcade wall at x=3 with arches every 3.2 along z
  float zz = mod(p.z,3.2)-1.6;
  float wallR = abs(p.x-3.0)-0.35;
  float ho = archOpen(vec2(zz,p.y), 1.15, 3.2);
  float wr = max(wallR, -ho);
  wr = max(wr, p.y-6.0);
  if(wr<d){ d=wr; m=2.; }
  // left solid wall with screen windows
  float wallL = abs(p.x+3.2)-0.35;
  float hw = archOpen(vec2(zz,p.y-1.0), 0.8, 2.4);
  float screen = star8(vec2(p.z,p.y)*2.2)-0.03;
  float wl = max(wallL, -max(hw, -screen*0.2+0.0));
  wl = max(wallL, -(max(hw, -(screen))));
  wl = max(wl, p.y-6.0);
  if(wl<d){ d=wl; m=3.; }
  // ceiling
  float ceil_ = 6.0 - p.y;
  if(ceil_<d){ d=ceil_; m=4.; }
  // columns between arches (round)
  vec3 cq = vec3(p.x-3.0, p.y, zz-1.6);
  float colm = length(cq.xz)-0.32;
  if(colm<d){ d=colm; m=2.; }
  return vec2(d,m);
}
vec3 calcN(vec3 p){ vec2 e=vec2(0.003,0.); return normalize(vec3(map(p+e.xyy).x-map(p-e.xyy).x,map(p+e.yxy).x-map(p-e.yxy).x,map(p+e.yyx).x-map(p-e.yyx).x)); }
float shadow(vec3 ro, vec3 rd){ float res=1.,t=0.02; for(int i=0;i<70;i++){ float h=map(ro+rd*t).x; res=min(res,16.*h/t); if(res<0.)break; t+=clamp(h,0.02,0.6); if(t>25.)break;} return clamp(res,0.,1.); }
vec4 render(vec3 ro, vec3 rd){
  float t=0.05; vec2 h; bool hit=false;
  for(int i=0;i<220;i++){ h=map(ro+rd*t); if(h.x<0.0004*t){hit=true;break;} t+=h.x*0.85; if(t>70.)break; }
  vec3 outside = mix(vec3(1.0,0.75,0.45), vec3(0.6,0.65,0.8), clamp(rd.y,0.,1.))*2.5;
  if(!hit) return vec4(outside,-1.);
  vec3 p=ro+rd*t; vec3 n=calcN(p);
  vec3 alb;
  if(h.y<1.5){ vec2 g=floor(p.xz*1.0); float ch=mod(g.x+g.y,2.); alb = mix(vec3(0.80,0.70,0.55), vec3(0.62,0.50,0.36), ch)*(0.85+0.15*fbm(p.xz*3.)); }
  else if(h.y<2.5){ alb = vec3(0.86,0.75,0.58)*(0.85+0.15*fbm(p.yz*2.));
    float band = step(abs(p.y-3.75),0.12); alb = mix(alb, vec3(0.55,0.42,0.22), band*0.6); }
  else if(h.y<3.5){ alb = vec3(0.80,0.68,0.50)*(0.85+0.15*fbm(p.yz*2.)); }
  else { alb = vec3(0.45,0.32,0.20)*(0.7+0.3*step(0.5,fract(p.z*1.6))); }
  float sh = shadow(p+n*0.01,uSun);
  float dif = max(dot(n,uSun),0.);
  vec3 sunC = vec3(2.2,1.45,0.8)*2.4;
  vec3 col = alb*(sunC*dif*sh + vec3(0.55,0.45,0.35)*0.22*(0.6+0.4*n.y) + vec3(0.6,0.4,0.2)*0.15*smoothstep(2.,0.,p.y));
  col = mix(col, vec3(1.0,0.78,0.5), 1.-exp(-t*0.007));
  return vec4(col, t*dot(rd,cFw));
}
</script>

<!-- ============ main + DoF ============ -->
<script id="main" type="x-shader">
void main(){
  vec3 rd = camRay(gl_FragCoord.xy);
  vec4 r = render(uCam, rd);
  fragOut = vec4(max(r.rgb,0.), r.a);
}
</script>
<script id="post" type="x-shader">#version 300 es
precision highp float;
uniform sampler2D uTex; uniform vec2 uRes; uniform float uFocus, uAper, uFov, uExposure, uWarm;
out vec4 fragOut;
float coc(float d){ if(d<0.) return 0.; return min(uAper*abs(d-uFocus)/(d*uFocus)*0.5*uRes.y/uFov, 24.); }
vec3 aces(vec3 x){ return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.); }
void main(){
  ivec2 ip = ivec2(gl_FragCoord.xy); ivec2 mx = ivec2(uRes)-1;
  vec4 c0 = texelFetch(uTex, ip, 0);
  vec3 acc = c0.rgb; float ws = 1.;
  if(uAper>0.){
    float dc = c0.a<0.?1e3:c0.a; float cc = coc(c0.a);
    for(int i=1;i<64;i++){
      float fi=float(i); float r=sqrt(fi/63.)*24.;
      vec2 o=vec2(cos(fi*2.39996),sin(fi*2.39996))*r;
      vec4 s = texelFetch(uTex, clamp(ip+ivec2(round(o)),ivec2(0),mx), 0);
      float ds = s.a<0.?1e3:s.a; float cs = coc(s.a);
      if(ds>dc) cs=min(cs,cc);
      float w = clamp((cs+1.-r)/1.5,0.,1.);
      acc += s.rgb*w; ws += w;
    }
  }
  vec3 c = acc/ws*uExposure;
  c = aces(c);
  c = pow(c, vec3(1./2.2));
  c = mix(c, c*vec3(1.04,1.0,0.93), uWarm);
  fragOut = vec4(c,1.);
}
</script>

<script>
const glc = document.getElementById('gl');
const gl = glc.getContext('webgl2',{preserveDrawingBuffer:true});
gl.getExtension('EXT_color_buffer_float');
const vsSrc = document.getElementById('vs').textContent.trim();
const src = id => document.getElementById(id).textContent;
function compile(type, s){ const sh=gl.createShader(type); gl.shaderSource(sh,s); gl.compileShader(sh);
  if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh)); return sh; }
function prog(fs){ const p=gl.createProgram(); gl.attachShader(p,compile(gl.VERTEX_SHADER,vsSrc)); gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fs));
  gl.bindAttribLocation(p,0,'aPos'); gl.linkProgram(p); if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u={}; const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS); for(let i=0;i<n;i++){const a=gl.getActiveUniform(p,i); u[a.name]=gl.getUniformLocation(p,a.name);} return {p,u}; }
const progs = {}; const sceneProg = name => progs[name] || (progs[name] = prog(src('prelude').trim()+'\n'+src(name)+'\n'+src('main')));
const post = prog(src('post').trim());
const vb=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,vb); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

// Arabic manuscript texture (real, verified phrases only)
function manuscript(){
  const c=document.createElement('canvas'); c.width=2048; c.height=1408; const x=c.getContext('2d');
  x.clearRect(0,0,2048,1408);
  x.direction='rtl'; x.textAlign='center'; x.textBaseline='middle';
  const ink='rgba(38,24,14,0.92)', red='rgba(140,30,18,0.92)';
  x.strokeStyle='rgba(120,40,20,0.55)'; x.lineWidth=5; x.strokeRect(120,100,1808,1208); x.lineWidth=2; x.strokeRect(140,120,1768,1168);
  const lines = [
    ['بسم الله الرحمن الرحيم', red, 92],
    ['أسماء بنت أبي بكر الصديق رضي الله عنهما', ink, 82],
    ['ذات النطاقين', red, 120],
    ['صنعت سفرة رسول الله صلى الله عليه وسلم في بيت أبي بكر', ink, 66],
    ['فلذلك سميت ذات النطاقين', ink, 72],
    ['نعم صلي أمك', ink, 76],
  ];
  let y=230;
  for(const [t,col,sz] of lines){ x.font=`${sz}px "FreeSerif"`; x.fillStyle=col; x.fillText(t,1024,y); y+= sz*1.0+105; }
  // ornamental rosettes in the margin
  for(const [cx,cy] of [[70,700],[1978,700]]){ x.save(); x.translate(cx,cy); x.strokeStyle='rgba(150,90,30,0.7)'; x.lineWidth=3;
    for(let i=0;i<8;i++){ x.rotate(Math.PI/4); x.beginPath(); x.ellipse(0,22,9,22,0,0,Math.PI*2); x.stroke(); } x.restore(); }
  const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,c); gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
  return t;
}
const mtex = manuscript();

function rt(w,h){ const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA32F,w,h,0,gl.RGBA,gl.FLOAT,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
  const f=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,f); gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0); return {t,f}; }

window.renderPlate = function(P){
  const W=P.w||2304, H=P.h||1296; glc.width=W; glc.height=H;
  const target = rt(W,H);
  const s = sceneProg(P.scene); gl.useProgram(s.p);
  const n=v=>{const l=Math.hypot(...v); return v.map(a=>a/l);};
  gl.uniform2f(s.u.uRes,W,H); gl.uniform3fv(s.u.uCam,P.cam); gl.uniform3fv(s.u.uTgt,P.tgt); gl.uniform3fv(s.u.uSun,n(P.sun));
  gl.uniform1f(s.u.uFov,Math.tan((P.fov||40)*Math.PI/360));
  if(s.u.uVar) gl.uniform1f(s.u.uVar,P.var||0); if(s.u.uSplit) gl.uniform1f(s.u.uSplit,P.split||0);
  if(s.u.uTex){ gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,mtex); gl.uniform1i(s.u.uTex,0); }
  gl.bindFramebuffer(gl.FRAMEBUFFER,target.f); gl.viewport(0,0,W,H);
  gl.enable(gl.SCISSOR_TEST);
  const N=16; for(let i=0;i<N;i++){ const y0=Math.floor(H*i/N), y1=Math.floor(H*(i+1)/N); gl.scissor(0,y0,W,y1-y0); gl.drawArrays(gl.TRIANGLE_STRIP,0,4); gl.finish(); }
  gl.disable(gl.SCISSOR_TEST);
  gl.useProgram(post.p); gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,W,H);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,target.t); gl.uniform1i(post.u.uTex,0);
  gl.uniform2f(post.u.uRes,W,H); gl.uniform1f(post.u.uFocus,P.focus||1); gl.uniform1f(post.u.uAper,P.aper||0);
  gl.uniform1f(post.u.uFov,Math.tan((P.fov||40)*Math.PI/360)); gl.uniform1f(post.u.uExposure,P.exposure||1); gl.uniform1f(post.u.uWarm,P.warm??0.4);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4); gl.finish();
  gl.deleteTexture(target.t); gl.deleteFramebuffer(target.f);
  return glc.toDataURL('image/jpeg',0.95);
};
window.ready=true;
</script>
